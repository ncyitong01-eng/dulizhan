<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHENYI MERCH Quoting</title>
    <style>
        :root {
            --primary-blue: #007AFF;
            --bg-gray: #f2f2f7;
            --card-white: #ffffff;
            --text-dark: #1c1c1e;
            --orange: #FF6600;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        /* 置顶导航栏 */
        nav {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 1000;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            border-bottom: 1px solid #e5e5ea;
        }
        nav span {
            font-weight: 600;
            color: #8e8e93;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px 12px;
            transition: all 0.2s;
        }
        nav span.active {
            color: var(--primary-blue);
            border-bottom: 2px solid var(--primary-blue);
        }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; }

        header { padding: 10px 0 20px; text-align: center; }
        header h1 { font-size: 1.4rem; margin: 0; font-weight: 700; color: var(--primary-blue); }
        header p { font-size: 0.8rem; color: #8e8e93; margin-top: 5px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 50px;
        }

        .card {
            background: var(--card-white);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .card h3 { font-size: 0.75rem; margin: 0; color: #3a3a3c; height: 32px; display: flex; align-items: center; justify-content: center; }

        /* 移动端底部抽屉 */
        .drawer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: flex-end;
        }

        .drawer-content {
            background: white;
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 25px 20px;
            box-sizing: border-box;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-bar { width: 40px; height: 5px; background: #ddd; border-radius: 10px; margin: -10px auto 20px; cursor: pointer; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: #666; }
        .input-row { display: flex; gap: 10px; }
        
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e5e5ea;
            border-radius: 10px;
            font-size: 1rem;
            background: #f9f9f9;
        }

        .result-box {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 10px;
        }

        .result-box label { font-size: 0.7rem; color: var(--primary-blue); font-weight: 700; }
        .result-box .price { font-size: 2.2rem; color: var(--primary-blue); font-weight: 800; }

        .btn-add {
            width: 100%; padding: 10px; background: #f2f2f7;
            border: 1px dashed #c7c7cc; border-radius: 8px;
            color: #3a3a3c; font-size: 0.8rem; margin-bottom: 15px;
        }

        /* 联系页面样式 */
        .contact-card { background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .contact-btn {
            display: block; text-decoration: none; padding: 15px; border-radius: 10px;
            margin-bottom: 10px; text-align: center; font-weight: bold; color: #fff;
            cursor: pointer; border: none; width: 100%; box-sizing: border-box; font-size: 1rem;
        }
        .tag { background: #f2f2f7; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 5px; color: #666; }

        /* Toast 提示样式 */
        #toast {
            visibility: hidden; min-width: 200px; background-color: #333; color: #fff;
            text-align: center; border-radius: 50px; padding: 12px;
            position: fixed; z-index: 3000; left: 50%; bottom: 100px;
            transform: translateX(-50%); font-size: 0.8rem;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 100px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 100px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<nav>
    <span id="nav-calc" class="active" onclick="switchTab('calc')">Pricing System</span>
    <span id="nav-contact" onclick="switchTab('contact')">Contact Us</span>
</nav>

<div class="container">
    <div id="section-calc" class="section active">
        <header>
            <h1>SHENYI MERCH</h1>
            <p>Smart Quote Tool</p>
        </header>
        <div class="grid" id="mainGrid"></div>
    </div>

    <div id="section-contact" class="section">
        <header>
            <h1>CONTACT US</h1>
            <p>Ready to help with your order</p>
        </header>

        <div class="contact-card">
            <h3 style="margin-top:0; font-size:1rem;">Quick Actions</h3>
            <a href="https://wa.me/8615180463235" class="contact-btn" style="background: #25D366;">WhatsApp Direct</a>
